apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: rajatg/payment-gateway:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PROCESSOR_URL
              value: "http://payment-processor:8080"